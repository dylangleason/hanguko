# Publishes a production build when a version tag is pushed:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match the version in mix.exs. CI runs first; if it passes, the
# Docker image is pushed to GitHub Container Registry as
# ghcr.io/<owner>/hanguko:0.2.0 (plus 0.2 and latest) and a GitHub Release is
# created with generated notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with mix.exs
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",?$/\1/p' mix.exs | head -n1)

          if [ "$tag" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $project in mix.exs"
            exit 1
          fi

          echo "version=$project" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip_image: true

  image:
    name: Publish image
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Docker image: `${{ needs.image.outputs.image }}`

            ```
            docker pull ${{ needs.image.outputs.image }}
            ```
