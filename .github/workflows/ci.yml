# Checks every push to main and every pull request: the same checks as
# `mix precommit`, the docs build, and the production Docker image.
#
# The release workflow calls this one before publishing an image, with
# `skip_image` set because it builds the image itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      skip_image:
        description: Skip the Docker image build (the caller builds it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the versions used locally (see README).
  OTP_VERSION: "29"
  ELIXIR_VERSION: "1.20.2"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    services:
      # Matches docker-compose.yml. config/test.exs connects to
      # postgres:postgres@localhost.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # AGENTS.md: docs must build without warnings (a broken reference means
      # a type or a link is missing).
      - name: Build docs
        run: mix docs --warnings-as-errors

  image:
    name: Docker image
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built but not pushed, so a broken Dockerfile shows up here rather than
      # when a release is tagged.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
