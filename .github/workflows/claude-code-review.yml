name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            When the review ends, for any reason, post one short PR comment
            with `gh pr comment` that says what you reviewed (files or commit
            range), how many findings you posted, and, if you stopped early or
            skipped the PR (draft, already reviewed, trivial change), why.
            Never include tokens, environment variables or other secrets.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports "success" even when the review bails out after a
      # couple of turns, so a green check proves nothing. Always leave a
      # comment saying how the run ended, so silence never means "unknown".
      - name: Report review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude-review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            body="Claude Code Review finished. Any findings are posted above; if there are none, it found nothing. [Run log]($RUN_URL)"
          else
            body="⚠️ Claude Code Review did not complete (step outcome: \`$OUTCOME\`). [Run log]($RUN_URL)"
          fi
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$body"

  # A second pass over the same diff, looking only for exploitable security
  # bugs. `/security-review` is built into Claude Code, so this needs no
  # plugin. It always reports how it ended (see the last step), so a clean
  # PR is distinguishable from a run that never reviewed anything.
  claude-security-review:
    name: Claude Security Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review diffs the branch against its base, so it needs the
          # history, not just the tip.
          fetch-depth: 0

      - name: Run Claude Security Review
        id: claude-security-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run /security-review over this pull request's changes.

            Then post the report as a single PR comment with `gh pr comment`.
            Whatever the outcome, the comment must say what you reviewed
            (files or commit range) and how many findings there were. If
            there were none, say the security review found no issues. If you
            stopped early or could not complete the review, say why.
            Never include tokens, environment variables or other secrets.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Report security review status
        if: always() && steps.claude-security-review.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.claude-security-review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --body "⚠️ Claude Security Review did not complete (step outcome: \`$OUTCOME\`). [Run log]($RUN_URL)"
